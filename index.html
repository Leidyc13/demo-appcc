<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Registro APPCC Obrador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky header with shift owner + tab rail; one working column of panels, cold-chain palette (stainless + teal) */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface-2:#f6f9f8; --ink:#142120; --muted:#566866; --line:#d5e0de;
  --accent:#0b6b63; --accent-ink:#ffffff; --accent-soft:#dcefec;
  --ok:#1d7a3e; --ok-bg:#e1f3e7; --warn:#9a5b00; --warn-bg:#fdf0d8; --crit:#b42318; --crit-bg:#fde4e1;
  --band:#cfe8e4;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#15201f; --surface-2:#1a2726; --ink:#e3ecea; --muted:#94a6a3; --line:#28403d;
  --accent:#4fbfb2; --accent-ink:#05201d; --accent-soft:#163a36;
  --ok:#62cf8f; --ok-bg:#15301f; --warn:#f2b552; --warn-bg:#352812; --crit:#ff8b7c; --crit-bg:#3a1a17;
  --band:#1d3e3a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#15201f; --surface-2:#1a2726; --ink:#e3ecea; --muted:#94a6a3; --line:#28403d;
  --accent:#4fbfb2; --accent-ink:#05201d; --accent-soft:#163a36;
  --ok:#62cf8f; --ok-bg:#15301f; --warn:#f2b552; --warn-bg:#352812; --crit:#ff8b7c; --crit-bg:#3a1a17;
  --band:#1d3e3a; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-block:14px 8px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:.85rem}
.shift{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.shift input{width:72px;text-transform:uppercase;font-family:var(--f-mono)}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:4px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;position:relative}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--crit);color:var(--surface);font:600 .72rem/18px var(--f-mono);text-align:center}
main{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.1rem;font-weight:700}
.lede{color:var(--muted);margin:4px 0 0;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel>h2{margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat:hover{border-color:var(--accent)}
.stat .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stat .v{font:700 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat.crit{border-left:4px solid var(--crit)} .stat.warn{border-left:4px solid var(--warn)} .stat.ok{border-left:4px solid var(--ok)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--line)}
.todo li.crit{border-left-color:var(--crit)} .todo li.warn{border-left-color:var(--warn)} .todo li.ok{border-left-color:var(--ok)}
.todo li div{flex:1;min-width:0}
.todo small{display:block;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.mut{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.mono,td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.86rem}
form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 .92rem var(--f-body);padding:9px 16px;border-radius:6px;cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:600 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.lot{font-family:var(--f-mono);font-weight:400}
.note{padding:10px 12px;border-radius:8px;font-size:.9rem}
.note.crit{background:var(--crit-bg);color:var(--crit)} .note.warn{background:var(--warn-bg);color:var(--warn)} .note.ok{background:var(--ok-bg);color:var(--ok)}
.check{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check div{flex:1;min-width:0}
.check small{color:var(--muted);display:block}
.spark{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.spark figure{margin:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.spark figcaption{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:600}
.spark figcaption span{white-space:nowrap;color:var(--muted);font-weight:400;font-family:var(--f-mono);font-size:.78rem}
.spark svg{width:100%;height:auto;display:block;margin-top:6px}
.tree{display:flex;flex-direction:column;gap:10px}
.tree .node{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.tree .arrow{color:var(--muted);font-size:.85rem;padding-left:12px}
.demo{font-size:.8rem;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:4px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){.stat,.chip,nav button{transition:border-color .15s,background .15s}}
</style>
</head><body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><b>Registro APPCC</b><span id="sub">Obrador sin gluten · Valencia <span class="demo">Datos de ejemplo</span></span></div>
      <label class="shift" for="resp">Responsable de turno <input id="resp" maxlength="4" aria-label="Iniciales del responsable de turno"></label>
    </div>
    <nav id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>

<script>
const ALERG=['Gluten','Crustáceos','Huevo','Pescado','Cacahuete','Soja','Leche','Frutos de cáscara','Apio','Mostaza','Sésamo','Sulfitos','Altramuces','Moluscos'];
const EQ=[
 {id:'cmp',nombre:'Cámara materias primas',min:0,max:4},
 {id:'cpt',nombre:'Cámara producto terminado',min:0,max:4},
 {id:'cong',nombre:'Congelador',min:-25,max:-18},
 {id:'vit',nombre:'Vitrina de venta',min:0,max:6}];
const TAREAS=[
 {id:'t1',zona:'Obrador',tarea:'Mesas y superficies de trabajo',frec:'diaria'},
 {id:'t2',zona:'Obrador',tarea:'Suelos y desagües',frec:'diaria'},
 {id:'t3',zona:'Utensilios',tarea:'Batidoras, moldes y bandejas',frec:'diaria'},
 {id:'t6',zona:'Aseos y vestuario',tarea:'Lavamanos, jabón y papel',frec:'diaria'},
 {id:'t4',zona:'Cámaras',tarea:'Interior de cámaras y juntas de puertas',frec:'semanal'},
 {id:'t5',zona:'Hornos',tarea:'Interior del horno y bandejas',frec:'semanal'}];
const TURNOS=['09:00','17:00'];
const KEY='appcc-demo-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const day=o=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return iso(d)};
const TODAY=day(0);
const fmt=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const daysTo=s=>Math.round((new Date(s+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>Math.random().toString(36).slice(2,9);
const eqById=id=>EQ.find(e=>e.id===id);
const inRange=(e,v)=>v>=e.min&&v<=e.max;

function seed(){
  const S={resp:'LC',temps:[],limp:{},rec:[],prod:[],inc:[]};
  let k=7;const rnd=()=>{k=(k*9301+49297)%233280;return k/233280};
  const base={cmp:2.4,cpt:2.8,cong:-20.5,vit:3.6};
  for(let o=-6;o<=0;o++){for(const h of TURNOS){
    if(o===0&&h==='17:00')continue;
    for(const e of EQ){let v=+(base[e.id]+(rnd()-.5)*1.6).toFixed(1);let acc='';
      if(o===0&&e.id==='vit'){v=7.8;acc='Producto de la vitrina pasado a cámara de producto terminado. Avisado el técnico de frío.'}
      S.temps.push({id:uid(),eq:e.id,v,fecha:day(o),hora:h,resp:o%2?'MR':'LC',acc});}}}
  for(let o=-6;o<0;o++){const d=day(o);S.limp[d]={};for(const t of TAREAS)if(t.frec==='diaria')S.limp[d][t.id]={resp:'MR',hora:'19:30'}}
  S.limp[day(-3)].t4={resp:'LC',hora:'18:10'};
  S.limp[day(-9)]={t5:{resp:'LC',hora:'18:40'}};
  S.limp[TODAY]={t1:{resp:'LC',hora:'08:40'},t3:{resp:'LC',hora:'08:55'}};
  const r=(o,prov,prod,lote,cad,temp,al,estado,obs='')=>({id:uid(),fecha:day(o),prov,prod,lote,cad:day(cad),temp,al,estado,obs,resp:'LC'});
  S.rec=[
    r(-10,'Molinos del Turia','Harina de arroz','HA-2611',170,null,[],'aceptado'),
    r(-10,'Almidones Levante','Almidón de maíz','AM-3390',290,null,[],'aceptado'),
    r(-8,'Cacao Levante','Chocolate negro 70 %','CH-5512',200,null,['Leche','Soja'],'aceptado','Trazas de leche declaradas por el proveedor'),
    r(-4,'Distribuciones Horta','Harina de trigo','HT-0098',120,null,['Gluten'],'rechazado','Enviado por error. Devuelto sin abrir; no entra al obrador sin gluten.'),
    r(-3,'Lácteos Valencia','Mantequilla','MT-7781',38,3.5,['Leche'],'aceptado'),
    r(-2,'Avícola Turia','Huevo líquido pasteurizado','HL-0412',3,3.1,['Huevo'],'aceptado')];
  const id=l=>S.rec.find(x=>x.lote===l).id;
  const p=(o,prod,pre,cant,ings)=>({id:uid(),fecha:day(o),prod,lote:pre+'-'+day(o).slice(2).replace(/-/g,''),cant,ings:ings.map(id),resp:'LC'});
  S.prod=[
    p(-2,'Bizcocho de chocolate sin gluten','BZ','24 uds',['HA-2611','HL-0412','MT-7781','CH-5512']),
    p(-1,'Magdalenas sin gluten','MG','60 uds',['HA-2611','AM-3390','HL-0412','MT-7781']),
    p(0,'Pan de molde sin gluten','PM','20 uds',['HA-2611','AM-3390'])];
  S.inc=[
    {id:uid(),fecha:TODAY,tipo:'Temperatura',desc:'Vitrina de venta a 7,8 °C en el control de las 09:00 (límite 6 °C).',acc:'Producto pasado a cámara de producto terminado. Avisado el técnico de frío.',estado:'abierta',resp:'LC'},
    {id:uid(),fecha:day(-4),tipo:'Recepción',desc:'Llega harina de trigo (lote HT-0098) en un pedido para obrador sin gluten.',acc:'Mercancía rechazada y devuelta sin abrir. Proveedor avisado por escrito.',estado:'cerrada',resp:'LC'}];
  return S;
}
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||seed();

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

/* ---------- derived status ---------- */
function weeklyDue(t){let last=null;for(const d of Object.keys(S.limp))if(S.limp[d][t.id]&&(!last||d>last))last=d;return !last||daysTo(last)<=-7?{due:true,last}:{due:false,last}}
function cleaningToday(){const done=S.limp[TODAY]||{};return TAREAS.filter(t=>t.frec==='diaria'||weeklyDue(t).due||done[t.id]).map(t=>({...t,done:done[t.id]||null,last:weeklyDue(t).last}))}
function status(){
  const hoy=S.temps.filter(t=>t.fecha===TODAY);
  const hechos=new Set(hoy.map(t=>t.eq+'|'+t.hora));
  const now=nowHM();
  const pendientes=[];for(const h of TURNOS)for(const e of EQ)if(h<=now&&!hechos.has(e.id+'|'+h))pendientes.push({e,h});
  const fuera=hoy.filter(t=>!inRange(eqById(t.eq),t.v));
  const limp=cleaningToday();const limpPend=limp.filter(t=>!t.done);
  const cad=S.rec.filter(r=>r.estado==='aceptado'&&daysTo(r.cad)<=5);
  const inc=S.inc.filter(i=>i.estado==='abierta');
  return {hoy,pendientes,fuera,limp,limpPend,cad,inc};
}

/* ---------- views ---------- */
const VIEWS=[['hoy','Hoy'],['temp','Temperaturas'],['limp','Limpieza'],['rec','Recepción'],['prod','Producción'],['traz','Trazabilidad'],['inc','Incidencias'],['inf','Informes']];
let cur=(location.hash||'').slice(1);if(!VIEWS.some(v=>v[0]===cur))cur='hoy';

function renderTabs(){
  const st=status();
  const badge={hoy:st.fuera.length+st.inc.length?'':'',inc:st.inc.length,limp:st.limpPend.length,temp:st.pendientes.length+st.fuera.length};
  $('#tabs').innerHTML=VIEWS.map(([k,l])=>`<button role="tab" aria-selected="${k===cur}" data-v="${k}">${l}${badge[k]?`<span class="dot">${badge[k]}</span>`:''}</button>`).join('');
}
function go(v){cur=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==cur){cur=h;render()}});

function render(){S.resp=S.resp||'';$('#resp').value=S.resp;renderTabs();$("#view").onclick=null;$("#view").innerHTML=V[cur]();(A[cur]||(()=>{}))()}
$('#resp').addEventListener('input',e=>{S.resp=e.target.value.toUpperCase();save()});
function needResp(){if(!S.resp){toast('Escribe tus iniciales en «Responsable de turno»');$('#resp').focus();return false}return true}

function sparkSVG(e){
  const pts=S.temps.filter(t=>t.eq===e.id).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).slice(-14);
  const W=260,H=80,pl=30,pr=8,pt=8,pb=16;
  const vals=pts.map(p=>p.v).concat([e.min,e.max]);let lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;
  const x=i=>pl+(pts.length<2?0:i*(W-pl-pr)/(pts.length-1));const y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>{const bad=!inRange(e,p.v);const last=i===pts.length-1;return (bad||last)?`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${bad?4:3}" fill="${bad?'var(--crit)':'var(--accent)'}"/>`:''}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Últimas lecturas de ${esc(e.nombre)}">
   <rect x="${pl}" y="${y(e.max).toFixed(1)}" width="${W-pl-pr}" height="${(y(e.min)-y(e.max)).toFixed(1)}" fill="var(--band)"/>
   <text x="${pl-4}" y="${(y(e.max)+4).toFixed(1)}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="var(--muted)">${e.max}</text>
   <text x="${pl-4}" y="${(y(e.min)+4).toFixed(1)}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="var(--muted)">${e.min}</text>
   <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}
   <text x="${pl}" y="${H-3}" font-size="10" font-family="JetBrains Mono,monospace" fill="var(--muted)">últimos 7 días</text></svg>`;
}

const V={
hoy(){
  const st=status();const nT=EQ.length*TURNOS.filter(h=>h<=nowHM()).length;
  const todo=[];
  st.fuera.forEach(t=>todo.push(['crit',`${eqById(t.eq).nombre} a ${t.v} °C a las ${t.hora}`,`Límite ${eqById(t.eq).min} a ${eqById(t.eq).max} °C. ${t.acc?'Acción: '+t.acc:'Falta registrar la acción correctiva.'}`,'temp']));
  st.inc.forEach(i=>todo.push(['crit',`Incidencia abierta: ${i.tipo}`,i.desc,'inc']));
  st.cad.forEach(r=>{const d=daysTo(r.cad);todo.push([d<0?'crit':'warn',`${r.prod} (lote ${r.lote}) ${d<0?'caducado':d===0?'caduca hoy':'caduca en '+d+' día'+(d>1?'s':'')}`,`Proveedor ${r.prov}. Usar primero o retirar.`,'rec'])});
  st.pendientes.forEach(p=>todo.push(['warn',`Falta la temperatura de las ${p.h}: ${p.e.nombre}`,'Control obligatorio dos veces al día.','temp']));

function prodAl(p){const s=new Set();p.ings.forEach(id=>{const r=S.rec.find(x=>x.id===id);r&&r.al.forEach(a=>s.add(a))});return ALERG.filter(a=>s.has(a))}
let trazQ='HL-0412';
function trazResult(q){
  q=(q||'').trim().toUpperCase();if(!q)return '<p class="muted">Escribe un lote.</p>';
  const p=S.prod.find(x=>x.lote.toUpperCase()===q);const r=S.rec.find(x=>x.lote.toUpperCase()===q);
  if(p){const al=prodAl(p);return `<h2>Hacia atrás: de qué está hecho ${esc(p.lote)}</h2><div class="tree" style="margin-top:12px"><div class="node"><b>${esc(p.prod)}</b> <span class="mono">${esc(p.lote)}</span><br><small class="muted">Elaborado ${fmt(p.fecha)} · ${esc(p.cant)} · Alérgenos: ${al.length?esc(al.join(', ')):'ninguno'}</small></div><div class="arrow">elaborado con</div>${p.ings.map(id=>{const x=S.rec.find(y=>y.id===id);return x?`<div class="node"><b>${esc(x.prod)}</b> <span class="mono">${esc(x.lote)}</span><br><small class="muted">${esc(x.prov)} · recibido ${fmt(x.fecha)} · cad. ${fmt(x.cad)}${x.al.length?' · '+esc(x.al.join(', ')):''}</small></div>`:''}).join('')}</div>`}
  if(r){const us=S.prod.filter(x=>x.ings.includes(r.id));return `<h2>Hacia delante: dónde se usó ${esc(r.lote)}</h2><div class="tree" style="margin-top:12px"><div class="node"><b>${esc(r.prod)}</b> <span class="mono">${esc(r.lote)}</span><br><small class="muted">${esc(r.prov)} · recibido ${fmt(r.fecha)} · ${r.estado}</small></div><div class="arrow">${us.length?'usado en '+us.length+' lote'+(us.length>1?'s':''):'no se ha usado en ningún lote'}</div>${us.map(x=>`<div class="node"><b>${esc(x.prod)}</b> <button class="chip lot" data-traz="${esc(x.lote)}">${esc(x.lote)}</button><br><small class="muted">Elaborado ${fmt(x.fecha)} · ${esc(x.cant)}</small></div>`).join('')}${us.length?`<p class="note warn" style="margin:0">Si el proveedor emite una alerta sobre este lote, estos son los lotes a inmovilizar o retirar.</p>`:''}</div>`}
  return `<p class="note warn">No hay ningún lote ${esc(q)} registrado.</p>`;
}

function csv(k){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const line=a=>a.map(q).join(';');
  if(k==='temps')return [line(['Fecha','Hora','Equipo','Temperatura °C','Mín','Máx','Estado','Acción correctiva','Responsable'])].concat(S.temps.slice().sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora)).map(t=>{const e=eqById(t.eq);return line([fmt(t.fecha),t.hora,e.nombre,String(t.v).replace('.',','),e.min,e.max,inRange(e,t.v)?'Correcta':'Fuera de rango',t.acc,t.resp])})).join('\n');
  if(k==='limp'){const out=[line(['Fecha','Zona','Tarea','Frecuencia','Hora','Responsable'])];Object.keys(S.limp).sort().forEach(d=>Object.entries(S.limp[d]).forEach(([id,v])=>{const t=TAREAS.find(x=>x.id===id);out.push(line([fmt(d),t.zona,t.tarea,t.frec,v.hora,v.resp]))}));return out.join('\n')}
  if(k==='rec')return [line(['Fecha','Proveedor','Producto','Lote','Caducidad','Temp. llegada','Alérgenos','Estado','Observaciones','Responsable'])].concat(S.rec.map(r=>line([fmt(r.fecha),r.prov,r.prod,r.lote,fmt(r.cad),r.temp??'ambiente',r.al.join(', '),r.estado,r.obs,r.resp]))).join('\n');
  if(k==='prod')return [line(['Fecha','Lote','Producto','Cantidad','Lotes de materia prima','Alérgenos','Responsable'])].concat(S.prod.map(p=>line([fmt(p.fecha),p.lote,p.prod,p.cant,p.ings.map(id=>S.rec.find(r=>r.id===id)?.lote).join(', '),prodAl(p).join(', '),p.resp]))).join('\n');
  return [line(['Fecha','Tipo','Descripción','Acción correctiva','Estado','Responsable'])].concat(S.inc.map(i=>line([fmt(i.fecha),i.tipo,i.desc,i.acc,i.estado,i.resp]))).join('\n');
}

  const upd=()=>{const s=new Set();sel.forEach(id=>S.rec.find(r=>r.id===id).al.forEach(a=>s.add(a)));const al=ALERG.filter(a=>s.has(a));const n=$('#pAl');
    if(!sel.size){n.className='note ok';n.textContent='Selecciona ingredientes para ver los alérgenos del lote.';return}
    n.className='note '+(al.includes('Gluten')?'crit':al.length?'warn':'ok');n.textContent=al.length?'Alérgenos a declarar en la etiqueta: '+al.join(', ')+(al.includes('Gluten')?'. ¡Atención! No se puede etiquetar como sin gluten.':''):'Sin alérgenos de declaración obligatoria.'};
  $('#pIng').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const id=b.dataset.r;sel.has(id)?sel.delete(id):sel.add(id);b.setAttribute('aria-pressed',sel.has(id));upd()};
  $('#fP').onsubmit=e=>{e.preventDefault();if(!needResp())return;if(!sel.size){toast('Marca al menos un lote de materia prima');return}
    const pre=($('#pPre').value.trim()||'LT').toUpperCase();let lote=pre+'-'+TODAY.slice(2).replace(/-/g,'');let n=2;while(S.prod.some(p=>p.lote===lote))lote=pre+'-'+TODAY.slice(2).replace(/-/g,'')+'-'+n++;
    S.prod.push({id:uid(),fecha:TODAY,prod:$('#pProd').value.trim(),lote,cant:$('#pCant').value.trim(),ings:[...sel],resp:S.resp});save();render();toast('Lote '+lote+' creado')};
  $('#view').onclick=e=>{const b=e.target.closest('[data-traz]');if(b){trazQ=b.dataset.traz;go('traz')}};
},
traz(){
  $('#fZ').onsubmit=e=>{e.preventDefault();trazQ=$('#zQ').value;$('#zOut').innerHTML=trazResult(trazQ)};
  $('#view').onclick=e=>{const b=e.target.closest('[data-traz]');if(b){trazQ=b.dataset.traz;$('#zQ').value=trazQ;$('#zOut').innerHTML=trazResult(trazQ)}};
},
inc(){
  $('#fI').onsubmit=e=>{e.preventDefault();if(!needResp())return;S.inc.push({id:uid(),fecha:TODAY,tipo:$('#iTipo').value,desc:$('#iDesc').value.trim(),acc:$('#iAcc').value.trim(),estado:'abierta',resp:S.resp});save();render();toast('Incidencia registrada')};
  $('#view').onclick=e=>{const b=e.target.closest('[data-close]');if(b){S.inc.find(i=>i.id===b.dataset.close).estado='cerrada';save();render();toast('Incidencia cerrada')}};
},
inf(){
  const fill=()=>$('#xOut').value=csv($('#xR').value);fill();$('#xR').onchange=fill;
  $('#xCopy').onclick=()=>{const t=$('#xOut').value;const fb=()=>{$('#xOut').select();toast('Selecciona y copia el texto (Ctrl+C)')};
    try{navigator.clipboard.writeText(t).then(()=>toast('CSV copiado'),fb)}catch(e){fb()}};
  $('#rst').onclick=()=>{$('#rstBox').innerHTML='<span>¿Borrar lo registrado y volver a los datos de ejemplo?</span><button class="btn danger sm" id="rstY" type="button">Sí, restablecer</button><button class="btn ghost sm" id="rstN" type="button">Cancelar</button>';
    $('#rstY').onclick=()=>{S=seed();save();render();toast('Datos de ejemplo restablecidos')};$('#rstN').onclick=render};
}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
render();
</script>
</body></html>
